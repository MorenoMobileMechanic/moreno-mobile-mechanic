<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Mechanic Service Request</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #d9534f;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Book Service Today With Moreno Mobile Mechanic</h2>
<form id="bookingForm" action="https://formspree.io/f/mvkkqjyw" method="POST">
        
    <!-- Contact Information -->
    <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
    </div>

    <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required placeholder="(555) 555-5555">
    </div>

    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="john@example.com">
    </div>

    <!-- Vehicle Information -->
        <div class="form-group">
            <label for="vehicleYear">Vehicle Year</label>
            <select id="vehicleYear" name="vehicleYear" required onchange="loadMakes()">
                <option value="">Select Year</option>
                <!-- Years generated dynamically via JavaScript down below -->
            </select>
        </div>

        <div class="form-group">
            <label for="vehicleMake">Vehicle Make</label>
            <select id="vehicleMake" name="vehicleMake" required onchange="loadModels()" disabled>
                <option value="">Select Make First</option>
            </select>
        </div>

        <div class="form-group">
            <label for="vehicleModel">Vehicle Model</label>
            <select id="vehicleModel" name="vehicleModel" required disabled>
                <option value="">Select Model First</option>
            </select>
        </div>

        <!-- Optional Identification Fields -->
        <div class="form-group">
            <label for="vin">VIN Number <span style="font-weight: normal; color: #777;">(Optional)</span></label>
            <input type="text" id="vin" name="vin" maxlength="17" placeholder="17-digit VIN">
        </div>

        <div class="form-group">
            <label for="licensePlate">License Plate & State <span style="font-weight: normal; color: #777;">(Optional)</span></label>
            <input type="text" id="licensePlate" name="licensePlate" placeholder="e.g., 7ABC123 (CA)">
        </div>

    <!-- Appointment Date & Time -->
    <div class="form-group">
        <label for="apptDate">Requested Date (Monday–Friday)</label>
        <input type="date" id="apptDate" name="apptDate" required onchange="validateDay(this)">
    </div>

    <div class="form-group">
        <label for="apptTime">Requested Time (7:00 AM – 4:00 PM)</label>
        <select id="apptTime" name="apptTime" required>
            <option value="">Select a time slot</option>
            <option value="07:00">7:00 AM</option>
            <option value="08:00">8:00 AM</option>
            <option value="09:00">9:00 AM</option>
            <option value="10:00">10:00 AM</option>
            <option value="11:00">11:00 AM</option>
            <option value="12:00">12:00 PM</option>
            <option value="13:00">1:00 PM</option>
            <option value="14:00">2:00 PM</option>
            <option value="15:00">3:00 PM</option>
            <option value="16:00">4:00 PM</option>
        </select>
    </div>

    <button type="submit">Submit Appointment Request</button>
</form>
</div>

<script>
    // Populate Years on page load (from 1990 to current year 2026)
    window.onload = function() {
        const yearSelect = document.getElementById('vehicleYear');
        const currentYear = 2026;
        for (let y = currentYear; y >= 1990; y--) {
            let option = document.createElement('option');
            option.value = y;
            option.textContent = y;
            yearSelect.appendChild(option);
        }
    };

    // Fetch Makes from CarQuery API based on selected Year
    function loadMakes() {
        const year = document.getElementById('vehicleYear').value;
        const makeSelect = document.getElementById('vehicleMake');
        const modelSelect = document.getElementById('vehicleModel');

        makeSelect.innerHTML = '<option value="">Select Make</option>';
        modelSelect.innerHTML = '<option value="">Select Model First</option>';
        modelSelect.disabled = true;

        if (!year) {
            makeSelect.disabled = true;
            return;
        }

        makeSelect.disabled = false;
        
        // Fetching makes from free public API
        fetch(`https://www.carqueryapi.com/api/0.3/?cmd=getMakes&year=${year}&callback=?`)
            .then(response => response.text())
            .then(text => {
                // Parse CarQuery JSONP response
                const data = JSON.parse(text.replace(/^[?\s*\(]+|\);\s*$/g, ''));
                data.makes.forEach(make => {
                    let option = document.createElement('option');
                    option.value = make.make_display;
                    option.textContent = make.make_display;
                    makeSelect.appendChild(option);
                });
            })
            .catch(error => {
                // Expanded fallback list with many more makes
                const commonMakes = [
                    "Acura", "Audi", "BMW", "Buick", "Cadillac", "Chevrolet", 
                    "Chrysler", "Dodge", "Fiat", "Ford", "GMC", "Genesis", 
                    "Honda", "Hyundai", "Infiniti", "Jaguar", "Jeep", "Kia", 
                    "Land Rover", "Lexus", "Lincoln", "Mazda", "Mercedes-Benz", 
                   "Mini", "Mitsubishi", "Nissan", "Porsche", "Ram", "Subaru", 
             "Tesla", "Toyota", "Volkswagen", "Volvo"
         ];
         commonMakes.forEach(make => {
                    let option = document.createElement('option');
                    option.value = make;
                    option.textContent = make;
                    makeSelect.appendChild(option);
                });
            });
    }

   // Fetch Models based on selected Year and Make
function loadModels() {
    const year = document.getElementById('vehicleYear').value;
    const make = document.getElementById('vehicleMake').value;
    const modelSelect = document.getElementById('vehicleModel');

    modelSelect.innerHTML = '<option value="">Select Model</option>';

    if (!make) {
        modelSelect.disabled = true;
        return;
    }

    modelSelect.disabled = false;

    // Direct, reliable model lists based on popular makes
    let models = [];
    switch (make) {
        case "Honda":
            models = ["Accord", "Civic", "CR-V", "Pilot", "Odyssey", "Fit", "HR-V", "Ridgeline"];
            break;
        case "Toyota":
            models = ["Camry", "Corolla", "RAV4", "Highlander", "Tacoma", "Tundra", "Prius", "4Runner"];
            break;
        case "Ford":
            models = ["F-150", "Explorer", "Escape", "Focus", "Mustang", "Edge", "Fusion", "Ranger"];
            break;
        case "Chevrolet":
            models = ["Silverado", "Equinox", "Malibu", "Cruze", "Tahoe", "Suburban", "Traverse", "Colorado"];
            break;
        case "Nissan":
            models = ["Altima", "Rogue", "Sentra", "Pathfinder", "Frontier", "Murano", "Versa"];
            break;
        case "Jeep":
            models = ["Wrangler", "Grand Cherokee", "Cherokee", "Renegade", "Compass", "Gladiator"];
            break;
        case "Ram":
            models = ["1500", "2500", "3500", "ProMaster"];
            break;
        case "Subaru":
            models = ["Outback", "Forester", "Crosstrek", "Impreza", "Ascent", "WRX"];
            break;
        case "Hyundai":
            models = ["Elantra", "Sonata", "Tucson", "Santa Fe", "Kona", "Palisade", "Accent"];
            break;
        case "Kia":
            models = ["Optima", "Sorento", "Sportage", "Forte", "Telluride", "Soul", "Stinger"];
            break;
        case "BMW":
            models = ["3 Series", "5 Series", "X3", "X5", "4 Series", "7 Series", "X1"];
            break;
        case "Mercedes-Benz":
            models = ["C-Class", "E-Class", "GLC", "GLE", "S-Class", "A-Class", "GLA"];
            break;
        default:
            models = ["Sedan", "Coupe", "SUV", "Truck", "Van", "Other / Custom Model"];
    }

    models.forEach(modelName => {
        let option = document.createElement('option');
        option.value = modelName;
        option.textContent = modelName;
        modelSelect.appendChild(option);
    });
}

    // Ensure selected date is Monday through Friday
    function validateDay(input) {
        const dateSelected = new Date(input.value + 'T00:00:00');
        const dayOfWeek = dateSelected.getDay(); // 0 = Sunday, 6 = Saturday

        if (dayOfWeek === 0 || dayOfWeek === 6) {
            alert("Appointments are only available Monday through Friday. Please select a weekday.");
            input.value = "";
        }
    }
</script>

</body>
</html>
