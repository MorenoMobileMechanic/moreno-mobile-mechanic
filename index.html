<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Mechanic Service Request</title>
   <style>
        /* Define Color Themes */
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --label-color: #555555;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --input-text: #333333;
        }

        /* Automatically switch colors if the user's device is in Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --container-bg: #1e1e1e;
                --text-color: #f1f1f1;
                --label-color: #b0b0b0;
                --input-bg: #2d2d2d;
                --input-border: #444444;
                --input-text: #ffffff;
            }
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease;
        }
        .container {
            max-width: 600px;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
            transition: background-color 0.3s ease;
        }
        h2 {
            color: var(--text-color);
            text-align: center;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--label-color);
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--input-text);
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            background-color: #d9534f;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            flex: 1;
        }
        button:hover {
            background-color: #c9302c;
        }
        button.secondary {
            background-color: #6c757d;
        }
        button.secondary:hover {
            background-color: #5a6268;
        }
        .step-indicator {
            text-align: center;
            font-weight: bold;
            color: var(--label-color);
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
   <!-- Business Logo -->
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="Website Header.jpg" alt="Moreno Mobile Mechanic Logo" style="width: 100%; max-width: 320px; height: auto;">
    </div>

    <h2>Book Service With Moreno Mobile Mechanic</h2>
    <!-- Google Translate Element -->
    <div id="google_translate_element" style="text-align: center; margin-bottom: 20px;"></div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'es,en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <form id="bookingForm" action="https://formspree.io/f/mvkkqjyw" method="POST">
        
        <!-- STEP 1: Customer Info & Address -->
        <div class="step active" id="step-1">
            <div class="step-indicator">Step 1 of 3: Customer & Location Information</div>
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="(555) 555-5555">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="serviceAddress">Service Address (Where should we meet you?)</label>
                <textarea id="serviceAddress" name="serviceAddress" placeholder="Street address, City, Zip Code" style="height: 70px;"></textarea>
            </div>

            <div class="button-group">
                <button type="button" onclick="nextStep(1)">Next: Vehicle Info &rarr;</button>
            </div>
        </div>

        <!-- STEP 2: Vehicle Information -->
        <div class="step" id="step-2">
            <div class="step-indicator">Step 2 of 3: Vehicle Details</div>

            <div class="form-group">
                <label for="vehicleYear">Vehicle Year</label>
                <select id="vehicleYear" name="vehicleYear" onchange="loadMakes()">
                    <option value="">Select Year</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vehicleMake">Vehicle Make</label>
                <select id="vehicleMake" name="vehicleMake" onchange="loadModels()" disabled>
                    <option value="">Select Make First</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vehicleModel">Vehicle Model</label>
                <select id="vehicleModel" name="vehicleModel" onchange="checkOtherModel(this)" disabled>
                    <option value="">Select Model First</option>
                </select>
            </div>

            <!-- Conditional Custom Model Box (Hidden by default) -->
            <div class="form-group" id="customModelGroup" style="display: none;">
                <label for="customModel">Enter Your Vehicle Model</label>
                <input type="text" id="customModel" name="customModel" placeholder="Type your vehicle model">
            </div>

            <div class="form-group">
                <label for="vin">VIN Number <span style="font-weight: normal; color: #777;">(Optional)</span></label>
                <input type="text" id="vin" name="vin" maxlength="17" placeholder="17-digit VIN">
            </div>

            <div class="form-group">
                <label for="licensePlate">License Plate & State <span style="font-weight: normal; color: #777;">(Optional)</span></label>
                <input type="text" id="licensePlate" name="licensePlate" placeholder="e.g., 7ABC123 (CA)">
            </div>

            <div class="button-group">
                <button type="button" class="secondary" onclick="prevStep(2)">&larr; Back</button>
                <button type="button" onclick="nextStep(2)">Next: Service & Time &rarr;</button>
            </div>
        </div>

        <!-- STEP 3: Service, Date, Time & Submit -->
        <div class="step" id="step-3">
            <div class="step-indicator">Step 3 of 3: Service & Appointment Time</div>

            <div class="form-group">
                <label for="serviceRequested">Service Requested</label>
                <select id="serviceRequested" name="serviceRequested" onchange="toggleDescription(this)">
                    <option value="">Select a Service</option>
                    <option value="Oil Change (Starting at $99.99)">Oil Change Service (Starting at $99.99)</option>
                    <option value="Vehicle Inspection/Diagnosis ($120)">Vehicle Concern Inspection/Diagnosis ($120 flat rate fee)</option>
                    <option value="Free Brake Quote">Free Brake Service Quote</option>
                    <option value="Pre Purchase Inspection ($120)">Pre Purchase Inspection ($120)</option>
                </select>
            </div>

            <div class="form-group" id="concernBoxGroup" style="display: none;">
                <label for="concernDetails">Details of Concern</label>
                <textarea id="concernDetails" name="concernDetails" placeholder="add details of concern in this box"></textarea>
            </div>

            <div class="form-group">
                <label for="apptDate">Requested Date (Monday–Friday)</label>
                <input type="date" id="apptDate" name="apptDate" onchange="validateDay(this)">
            </div>

            <div class="form-group">
                <label for="apptTime">Requested Time (7:00 AM – 4:00 PM)</label>
                <select id="apptTime" name="apptTime">
                    <option value="">Select a time slot</option>
                    <option value="07:00">7:00 AM</option>
                    <option value="08:00">8:00 AM</option>
                    <option value="09:00">9:00 AM</option>
                    <option value="10:00">10:00 AM</option>
                    <option value="11:00">11:00 AM</option>
                    <option value="12:00">12:00 PM</option>
                    <option value="13:00">1:00 PM</option>
                    <option value="14:00">2:00 PM</option>
                    <option value="15:00">3:00 PM</option>
                    <option value="16:00">4:00 PM</option>
                </select>
            </div>

            <div class="button-group">
                <button type="button" class="secondary" onclick="prevStep(3)">&larr; Back</button>
                <button type="submit">Submit Appointment Request</button>
            </div>
        </div>

    </form>
    
    <div style="text-align: center; margin-top: 20px; font-size: 14px;">
        <a href="privacy.html" style="color: #666; text-decoration: none;">Privacy Policy</a>
    </div>
</div>

<script>
    // Populate Years on page load
    window.onload = function() {
        const yearSelect = document.getElementById('vehicleYear');
        const currentYear = 2026;
        for (let y = currentYear; y >= 1990; y--) {
            let option = document.createElement('option');
            option.value = y;
            option.textContent = y;
            yearSelect.appendChild(option);
        }
    };

    // Step navigation logic with simple validation checks
    function nextStep(current) {
        if (current === 1) {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const address = document.getElementById('serviceAddress').value;
            if (!name || !phone || !email || !address) {
                alert("Please fill out all customer information and your service address before proceeding.");
                return;
            }
        }
        if (current === 2) {
            const year = document.getElementById('vehicleYear').value;
            const make = document.getElementById('vehicleMake').value;
            const model = document.getElementById('vehicleModel').value;
            if (!year || !make || !model) {
                alert("Please select your vehicle Year, Make, and Model before proceeding.");
                return;
            }
        }

        document.getElementById(`step-${current}`).classList.remove('active');
        document.getElementById(`step-${current + 1}`).classList.add('active');
        window.scrollTo(0, 0);
    }

    function prevStep(current) {
        document.getElementById(`step-${current}`).classList.remove('active');
        document.getElementById(`step-${current - 1}`).classList.add('active');
        window.scrollTo(0, 0);
    }

    // Toggle description box visibility for diagnosis
    function toggleDescription(select) {
        const concernGroup = document.getElementById('concernBoxGroup');
        if (select.value === "Vehicle Inspection/Diagnosis ($120)") {
            concernGroup.style.display = "block";
        } else {
            concernGroup.style.display = "none";
            document.getElementById('concernDetails').value = "";
        }
    }

    // Fetch Makes from CarQuery API based on selected Year
    function loadMakes() {
        const year = document.getElementById('vehicleYear').value;
        const makeSelect = document.getElementById('vehicleMake');
        const modelSelect = document.getElementById('vehicleModel');

        makeSelect.innerHTML = '<option value="">Select Make</option>';
        modelSelect.innerHTML = '<option value="">Select Model First</option>';
        makeSelect.disabled = true;

        if (!year) {
            makeSelect.disabled = true;
            return;
        }

        makeSelect.disabled = false;
        
        fetch(`https://www.carqueryapi.com/api/0.3/?cmd=getMakes&year=${year}&callback=?`)
            .then(response => response.text())
            .then(text => {
                const data = JSON.parse(text.replace(/^[?\s*\(]+|\);\s*$/g, ''));
                data.makes.forEach(make => {
                    let option = document.createElement('option');
                    option.value = make.make_display;
                    option.textContent = make.make_display;
                    makeSelect.appendChild(option);
                });
            })
            .catch(error => {
                const commonMakes = [
                    "Acura", "Audi", "BMW", "Buick", "Cadillac", "Chevrolet", 
                    "Chrysler", "Dodge", "Fiat", "Ford", "GMC", "Genesis", 
                    "Honda", "Hyundai", "Infiniti", "Jaguar", "Jeep", "Kia", 
                    "Land Rover", "Lexus", "Lincoln", "Mazda", "Mercedes-Benz", 
                    "Mini", "Mitsubishi", "Nissan", "Porsche", "Ram", "Subaru", 
                    "Tesla", "Toyota", "Volkswagen", "Volvo"
                ];
                commonMakes.forEach(make => {
                    let option = document.createElement('option');
                    option.value = make;
                    option.textContent = make;
                    makeSelect.appendChild(option);
                });
            });
    }

 // Fetch Models based on selected Year and Make
    function loadModels() {
        const year = document.getElementById('vehicleYear').value;
        const make = document.getElementById('vehicleMake').value;
        const modelSelect = document.getElementById('vehicleModel');

        // Hide custom model box if they switch makes/years
        document.getElementById('customModelGroup').style.display = 'none';
        document.getElementById('customModel').value = '';

        modelSelect.innerHTML = '<option value="">Select Model</option>';

        if (!make) {
            modelSelect.disabled = true;
            return;
        }

        modelSelect.disabled = false;

        let models = [];
        switch (make) {
            case "Honda": models = ["Accord", "Civic", "CR-V", "Pilot", "Odyssey", "Fit", "HR-V", "Ridgeline", "Other"]; break;
            case "Toyota": models = ["Camry", "Corolla", "RAV4", "Highlander", "Tacoma", "Tundra", "Prius", "4Runner", "Other"]; break;
            case "Ford": models = ["F-150", "Explorer", "Escape", "Focus", "Mustang", "Edge", "Fusion", "Ranger", "Other"]; break;
            case "Chevrolet": models = ["Silverado", "Equinox", "Malibu", "Cruze", "Tahoe", "Suburban", "Traverse", "Colorado", "Other"]; break;
            case "Nissan": models = ["Altima", "Rogue", "Sentra", "Pathfinder", "Frontier", "Murano", "Versa", "Other"]; break;
            case "Jeep": models = ["Wrangler", "Grand Cherokee", "Cherokee", "Renegade", "Compass", "Gladiator", "Other"]; break;
            case "Ram": models = ["1500", "2500", "3500", "ProMaster", "Other"]; break;
            case "Subaru": models = ["Outback", "Forester", "Crosstrek", "Impreza", "Ascent", "WRX", "Other"]; break;
            case "Hyundai": models = ["Elantra", "Sonata", "Tucson", "Santa Fe", "Kona", "Palisade", "Accent", "Other"]; break;
            case "Kia": models = ["Optima", "Sorento", "Sportage", "Forte", "Telluride", "Soul", "Stinger", "Other"]; break;
            case "BMW": models = ["3 Series", "5 Series", "X3", "X5", "4 Series", "7 Series", "X1", "Other"]; break;
            case "Mercedes-Benz": models = ["C-Class", "E-Class", "GLC", "GLE", "S-Class", "A-Class", "GLA", "Other"]; break;
            default: models = ["Sedan", "Coupe", "SUV", "Truck", "Van", "Other"];
        }

        models.forEach(modelName => {
            let option = document.createElement('option');
            option.value = modelName;
            option.textContent = modelName === "Other" ? "Other (Type custom model)" : modelName;
            modelSelect.appendChild(option);
        });
    }

    // Toggle custom model box when "Other" is selected
    function checkOtherModel(select) {
        const customGroup = document.getElementById('customModelGroup');
        if (select.value === "Other") {
            customGroup.style.display = "block";
            document.getElementById('customModel').required = true;
        } else {
            customGroup.style.display = "none";
            document.getElementById('customModel').required = false;
            document.getElementById('customModel').value = "";
        }
    }

    // Ensure selected date is Monday through Friday
    function validateDay(input) {
        const dateSelected = new Date(input.value + 'T00:00:00');
        const dayOfWeek = dateSelected.getDay(); 

        if (dayOfWeek === 0 || dayOfWeek === 6) {
            alert("Appointments are only available Monday through Friday. Please select a weekday.");
            input.value = "";
        }
    }
</script>

</body>
</html>
