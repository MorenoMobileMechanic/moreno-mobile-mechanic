<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Mechanic Service Request</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #d9534f;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Book Mobile Mechanic Service</h2>
    <form id="bookingForm" onsubmit="handleBooking(event)">
        
        <!-- Contact Information -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="John Doe">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required placeholder="(555) 555-5555">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="john@example.com">
        </div>

        <!-- Vehicle Information -->
        <div class="form-group">
            <label for="vehicleYear">Vehicle Year</label>
            <input type="number" id="vehicleYear" min="1950" max="2027" required placeholder="2018">
        </div>

        <div class="form-group">
            <label for="vehicleMake">Vehicle Make</label>
            <input type="text" id="vehicleMake" required placeholder="Honda">
        </div>

        <div class="form-group">
            <label for="vehicleModel">Vehicle Model</label>
            <input type="text" id="vehicleModel" required placeholder="Civic">
        </div>

        <!-- Appointment Date & Time -->
        <div class="form-group">
            <label for="apptDate">Requested Date (Monday–Friday)</label>
            <input type="date" id="apptDate" required onchange="validateDay(this)">
        </div>

        <div class="form-group">
            <label for="apptTime">Requested Time (7:00 AM – 4:00 PM)</label>
            <select id="apptTime" required>
                <option value="">Select a time slot</option>
                <option value="07:00">7:00 AM</option>
                <option value="08:00">8:00 AM</option>
                <option value="09:00">9:00 AM</option>
                <option value="10:00">10:00 AM</option>
                <option value="11:00">11:00 AM</option>
                <option value="12:00">12:00 PM</option>
                <option value="13:00">1:00 PM</option>
                <option value="14:00">2:00 PM</option>
                <option value="15:00">3:00 PM</option>
                <option value="16:00">4:00 PM</option>
            </select>
        </div>

        <button type="submit">Submit Appointment Request</button>
    </form>
</div>

<script>
    // Ensure selected date is Monday through Friday
    function validateDay(input) {
        const dateSelected = new Date(input.value + 'T00:00:00');
        const dayOfWeek = dateSelected.getDay(); // 0 = Sunday, 6 = Saturday

        if (dayOfWeek === 0 || dayOfWeek === 6) {
            alert("Appointments are only available Monday through Friday. Please select a weekday.");
            input.value = "";
        }
    }

    function handleBooking(event) {
        event.preventDefault();
        
        const name = document.getElementById('name').value;
        const vehicle = `${document.getElementById('vehicleYear').value} ${document.getElementById('vehicleMake').value} ${document.getElementById('vehicleModel').value}`;
        const date = document.getElementById('apptDate').value;
        const time = document.getElementById('apptTime').value;

        alert(`Thank you, ${name}! Your request for a ${vehicle} on ${date} at ${time} has been submitted. We will contact you shortly to confirm.`);
        
        document.getElementById('bookingForm').reset();
    }
</script>

</body>
</html>
